name: Local macOS build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Bootstrap checked vendor toolchains
        run: python3 scripts/bootstrap-toolchains.py
      - name: Verify
        run: python3 scripts/verify.py
      - name: Compile provider boundary
        run: python3 scripts/check-provider.py
      - name: Build local DMG
        run: python3 scripts/build-local.py --dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Madego-local-arm64-NO-VPN-NOT-NOTARIZED
          path: |
            artifacts/local-*/*.dmg
            artifacts/local-*/manifest.json
